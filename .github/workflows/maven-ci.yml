name: Java CI with Maven and Docker in Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.sonar/cache
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set Maven Sonar Goal
        run: |
          echo "SONARGOAL=sonar:sonar" >> $GITHUB_ENV
        if: ${{ env.SONAR_TOKEN != '' }}

      - name: Set Maven Coveralls Options
        run: |
          echo "COVERALLS_OPTIONS=-Pcoveralls coveralls:report" >> $GITHUB_ENV
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}

      - name: Build with Maven
        run: >
          xvfb-run mvn verify -Pjacoco $COVERALLS_OPTIONS $SONARGOAL
          -DrepoToken=$COVERALLS_REPO_TOKEN
          -Dsonar.organization=sohailnajib
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=sohailnajib_AST
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
